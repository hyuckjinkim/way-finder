nodeLinker: hoisted

packages:
  - 'packages/*'
  - 'apps/*'
  - 'services/*'

overrides:
  expo: 56.0.9
  react-native: 0.85.3
  react-native-web: 0.21.2
  wrangler: 4.98.0
  '@react-native-kakao/map': 2.2.7
  '@maplibre/maplibre-react-native': 11.3.3
  maplibre-gl: 5.24.0

# 신규 게시 버전을 최소 게시 경과 정책에서 제외 (CI 재현성 위해 명시 핀).
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260607.1'

# 빌드 스크립트 정책 (pnpm 11 `allowBuilds` 맵: true=실행, false=건너뜀).
#   esbuild/sharp/workerd: wrangler dry-run/번들 빌드 허용.
#   msgpackr-extract(Expo metro msgpack 가속기, JS 폴백 있음) / return-fetch(@react-native-kakao/core,
#   사실상 순수 JS): /mnt/d에서 node-gyp 네이티브 컴파일을 피하려 빌드 건너뜀. 이 명시적 결정이
#   deps-status dirty 플래그를 해제해 `pnpm -r <script>`의 자동 install 재실행을 막는다(5워커 병렬 안전).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  msgpackr-extract: false
  return-fetch: false
