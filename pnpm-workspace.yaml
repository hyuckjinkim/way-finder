nodeLinker: hoisted

packages:
  - 'packages/*'
  - 'apps/*'
  - 'services/*'

overrides:
  expo: 56.0.9
  react-native: 0.85.3
  react-native-web: 0.21.2
  wrangler: 4.98.0
  '@react-native-kakao/map': 2.2.7
  '@maplibre/maplibre-react-native': 11.3.3
  maplibre-gl: 5.24.0

# 신규 게시 버전을 최소 게시 경과 정책에서 제외 (CI 재현성 위해 명시 핀).
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@4.20260607.1'

# wrangler dry-run/번들에 필요한 빌드 스크립트 허용.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
