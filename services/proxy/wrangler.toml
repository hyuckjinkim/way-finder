# Cloudflare Workers 설정 — wayfinder 프록시 (Foundation F4)
# 시크릿 없음. 실 키는 `wrangler secret put <NAME>`으로 별도 주입 (앱/저장소에 키 미포함).

name = "wayfinder-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-07"
compatibility_flags = ["nodejs_compat"]

# Workers KV — 캐싱 (블로그 6h·장소 24h·구글 30일 한도). 실 배포 시 id를 발급받아 채운다.
# 로컬/dry-run에서는 placeholder id로 충분.
[[kv_namespaces]]
binding = "CACHE"
id = "5aa4e9d60ce946df88338e544cc5a9bb"

# IP 레이트리밋 — Workers Rate Limiting 바인딩 (KV 카운터 대체: 무료 쿼터·지연 방어). period는 10 또는 60만 허용.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 비밀이 아닌 런타임 플래그. 키 미설정 시 앱은 데모 모드로 동작 (스트림 A5).
[vars]
DEMO_MODE = "auto"

# 실 시크릿(여기에 값을 넣지 말 것): Workspace/key-lib/keys.env + 루트 .env → `scripts/env-sync.sh --deploy`로 일괄 업로드.
# 이름 목록은 src/config.ts의 Env / key-lib/keys.env.example 참조.
